# /usecases 記事内 挿入画像 仕様書
#
# 対象: 2026-08-13〜14 に作成・改稿した3記事
# 目的: 「どの位置に、何を伝える画像を入れるか」だけを定義する。
#       構図・イラストの中身は作り手の裁量。
#
# 進め方:
#   1. 画像を生成する
#   2. WebP に変換して articles[].dir に置く
#      magick "input.png" -resize 1600x\> -quality 85 -strip "NN-name.webp"
#   3. insert_after の見出しの直後に <figure> を差し込む（Claude Code 側で実施可）

version: 3
created: "2026-08-14"

# ==========================================================================
# 2種類を使い分ける
# ==========================================================================
types:

  message:
    説明: 短い言葉＋イラストだけ。読む負荷をかけず、セクションの入口で息をつがせる。これを基本にする。
    サイズ: 1600x600
    構成: 左に短い言葉、右にイラスト。白背景。余白を広くとる。
    言葉: 1行・10〜16文字程度。文章にしない。
    参考: 「失敗したケース」「役割を限定」のような、言葉とイラストだけのもの

  diagram:
    説明: 構造そのものが要点の箇所だけ。使いすぎない（1記事に2〜3枚）。
    サイズ: 1600x900
    構成: 見出し＋サブコピー、角丸カードとイラストで関係を示し、下部に結論を1行。
    参考: public/images/blog/ai-development-bottleneck-shift/quality-by-design.webp

common:
  形式: webp（品質85 / 50〜150KB 目安）
  トーン: 白背景・青系のフラットイラスト。人物は青とグレーの2色。
  配置: 該当セクションの見出し直後（本文より前）に1枚

# 事実面だけの注意（表現の自由度には関わらない）
cautions:
  - 画像に入れる数値は本文にある値だけにする
  - 「95%削減」「数日→1分」は使わない（本文から削除済みの旧数値）
  - PoC記事に費用の相場金額と標準期間を入れない（本文で出さない方針のため）
  - 顧客名・実在企業のロゴを入れない
  - AIが最終金額や契約を単独で決めているように描かない（人の承認を経る）

