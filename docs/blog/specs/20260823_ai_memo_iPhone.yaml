      - "Google Driveを保存先にする構成も可能"
      - "会社の運用に合わせて変更できる"
    max_length: "短め"

  - level: 2
    id: "troubleshooting"
    title: "一番詰まったのはショートカットの使い方"
    content:
      - "オーディオ変数の渡し方が分かりにくい"
      - "カレンダー予定検索のUIが分かりにくい"
      - "If文の設定が直感的ではない"
