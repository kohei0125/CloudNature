      - "iPhoneからすぐ使える"
      - "Claudeで議事録形式を自由に変更できる"
      - "Notion / Google Driveへ保存できる"

    cautions:
      - "Claudeの利用上限"
      - "最初のショートカット作成に少し時間がかかる"
      - "iOSアップデートでUIが変わる可能性がある"

    explicitly_exclude:
      - "録音品質によって精度が左右される"
      - "完全自動ではない"

  - level: 2
    id: "comparison"
    title: "専用のAI議事録サービスとの使い分け"
    content:
      - "Nottaなどの専用サービスには専用サービスのメリットがある"
      - "導入設定をせずすぐ利用したい場合は専用サービスが便利"
      - "既にClaudeを使っていて、自社向けにカスタマイズしたい場合は今回の構成が向く"
    prohibited:
      - "価格批判"
      - "精度批判"
      - "機能不足の指摘"
      - "優劣ランキング"

  - level: 2
    id: "conclusion"
    title: "まとめ"
    key_message: >
      AI活用では新しいサービスを増やすことだけが解決策ではない。
      すでに使っているツール同士をつなぐだけでも、
      業務はかなり自動化できる。


