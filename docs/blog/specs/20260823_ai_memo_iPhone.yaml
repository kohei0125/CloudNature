      - level: 3
        title: "2. 録音データを文字起こしする"

      - level: 3
        title: "3. Googleカレンダーから今日の予定を取得する"

      - level: 3
        title: "4. Claudeへ文字起こしを送る"

      - level: 3
        title: "5. Claudeで議事録を作成する"

      - level: 3
        title: "6. NotionやGoogle Driveへ保存する"

  - level: 2
    id: "calendar"
    title: "カレンダー連携もショートカットで"
    key_message: >
      カレンダーは議事録生成そのものには使わず、
      会議タイトル選定の補助情報として利用する。
    content:
      - "開始時間の厳密な判定はやめた"
      - "今日の予定をすべて取得する"
      - "Claudeに候補として渡す"
      - "シンプルな方が運用しやすかった"

  - level: 2
    id: "prompt"
