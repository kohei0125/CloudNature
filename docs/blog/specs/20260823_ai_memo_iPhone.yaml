version: 2
updated: "2026-08-23"
owner: "CloudNature"
project: "usecases"

purpose: >
  iPhoneのショートカットとClaudeを使い、
  会議の録音から文字起こし、AI議事録作成、
  NotionまたはGoogle Driveへの保存までを自動化した実例記事を制作する。

  記事の中心価値は「議事録専用AIサービスを追加契約しなくても、
  iPhoneとClaudeを使って実用的な議事録作成環境を構築できること」。

  Claude Codeが本文執筆時に迷わないよう、
  SEO方針、記事の主張、構成、画像、注意事項まで定義する。


# ============================================================
# 記事全体の方針
# ============================================================

global_rules:

  core_message: >
    議事録AIのためだけに新しいサービスを追加契約しなくても、
    普段使っているiPhoneとClaudeを組み合わせれば、
    ホーム画面のアイコンを押して録音を開始するだけで、
    文字起こし、議事録作成、保存までつなげられる。

  primary_value:
    - "追加の議事録専用サービスを契約せずに始められる"
    - "iPhoneからワンタップで録音開始できる"
    - "Claudeで自由な形式の議事録を生成できる"
    - "NotionやGoogle Driveへ保存できる"
    - "一度ショートカットを作れば、普段の操作は非常に少ない"

  positioning: >
    「完全無料の議事録サービス」とは表現しない。
    Claudeをすでに利用している人であれば、
    新たな議事録専用サービスへの追加課金をせずに構築できる、
    または無料プランから試せる、という表現を基本とする。

  tone:
    - "実際に自社で使っている実践例として書く"
    - "技術記事だが非エンジニアにも理解できる"
    - "専用サービスとの対立構造にはしない"
    - "便利さを率直に伝える"
    - "過度な誇張をしない"

  prohibited_claims:
    - "完全無料で無制限に使える"
    - "他の議事録AIより必ず優れている"
    - "専用議事録サービスは不要"
    - "100%正確"
    - "すべての企業にこの方法が最適"

  terminology:
    preferred:
      - "議事録自動化"
      - "AI議事録"
      - "iPhoneショートカット"
      - "Claude"
      - "文字起こし"
      - "自動保存"
    avoid:
      - "半自動"
      - "完全自動ではない"
      - "価値の中心"
      - "二次的な選択肢"


# ============================================================
# 実際に構築した構成
# ============================================================

implementation_facts:

  trigger:
    method: "iPhoneホーム画面に追加したショートカットアイコン"
    user_action:
      - "アイコンをタップ"
      - "会議を録音"
      - "録音を終了"

  after_recording:
    automated_flow:
      - "録音データを取得"
      - "iPhoneで文字起こし"
      - "Googleカレンダーから今日の予定を取得"
      - "Claudeへ文字起こしと予定候補を送信"
      - "Claudeが議事録を生成"
      - "指定した保存先へ保存"

  calendar:
    service: "Google Calendar"
    method: "iPhone標準カレンダーとの同期経由"
    logic: >
      複雑な開始時刻判定は採用せず、
      「今日の予定」を取得するシンプルな設計とした。
    purpose: >
      Googleカレンダーの予定は、
      議事録本文そのものではなく、
      Claudeが会議タイトルを判断するための補助情報として利用する。

  ai:
    service: "Claude"
    method: "iOSショートカットのClaudeアクション"
    responsibilities:
      - "文字起こし内容の整理"
      - "会議タイトルの判断"
      - "概要の生成"
      - "決定事項の抽出"
      - "TODOの抽出"
      - "次回確認事項の整理"
      - "議事録フォーマットへの整形"
      - "保存処理"

  destinations:
    primary_examples:
      - "Notion"
      - "Google Drive"
    note: >
      記事では保存先連携を主役にしない。
      「議事録完成後、用途に応じてNotionやGoogle Driveにも保存できる」
      程度の説明でよい。

  notion:
    example: "プライベートページ配下へ議事録を自動作成"

  google_drive:
    example: >
      議事録をGoogle Drive側へ保存する構成にも変更可能であることを紹介する。
      詳細なGoogle Drive API実装記事にはしない。


# ============================================================
# 記事冒頭
# ============================================================

intro:

  hook: >
    NottaやProudNote、tl;dvなど、
    AI議事録サービスを仕事で使っている方も増えています。

    こうした専用サービスは非常に便利ですが、
    「議事録を作る」という目的だけで考えると、
    すでに使っているiPhoneとClaudeだけでも
    かなりのところまで自動化できます。

  personal_story: >
    私自身も以前はGensparkの議事録AIを使用していました。

    今回、普段の打ち合わせをiPhoneで録音し、
    文字起こしをClaudeに渡して、
    議事録を作成した後にNotionへ保存するところまで
    iPhoneショートカットでつないでみました。

  result: >
    一度ショートカットを作ってしまえば、
    普段やることはiPhoneのホーム画面に置いた
    「打合せ録音」アイコンをタップするだけです。

    録音終了後はClaudeが内容を整理し、
    議事録を作成して保存まで進めます。

  competitor_policy:
    allowed:
      - "Notta"
      - "ProudNote"
      - "tl;dv"
      - "Genspark"
    rule: >
      他サービスは「有名なAI議事録サービスの例」としてのみ扱う。
      料金、精度、機能不足などの批判は行わない。
      各サービスには専用サービスならではのメリットがあることも明記する。
    fact_check: >
      公開前に各サービスの正式名称・公式表記・現行サービス提供状況を確認する。


