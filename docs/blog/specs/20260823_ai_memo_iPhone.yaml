      - "専用サービスを否定しない"
      - "iPhoneとClaudeでも実現できるという選択肢を提示"
      - "筆者も以前Gensparkの議事録AIを使用していた"
      - "今回実際に自分用の仕組みに切り替えた"

  - level: 2
    id: "result"
